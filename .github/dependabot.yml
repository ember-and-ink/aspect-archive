---
# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# This file was deleted by accident in 478105c (the nicegui -> React rewrite)
# on 2026-07-01, so no version updates ran for a month while CVEs were being
# patched by hand. The npm entry covers the frontend that same commit added,
# which never had coverage at all.
#
# The shape, and why:
#
#   - Version updates for uv, npm and github-actions share ONE multi-ecosystem
#     group, so a week's bumps arrive as a single PR instead of one per
#     ecosystem.
#   - Security updates can't join that group (multi-ecosystem groups are
#     version-updates only) and otherwise open one PR per vulnerable package --
#     four at once on 2026-10-01, all transitive dev dependencies. The
#     `applies-to: security-updates` group on each entry folds them into one PR
#     per ecosystem.
#   - dependabot-automerge.yml merges all of the above once the required checks
#     pass. Docker is the exception; see the bottom of this file.
version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly

updates:
  # Python — uv resolves from pyproject.toml and writes uv.lock.
  - package-ecosystem: uv
    directory: /
    # `patterns` is required on every member of a multi-ecosystem group.
    patterns: ['*']
    multi-ecosystem-group: dependencies
    # Nobody reviews these PRs before they merge, so wait a week after a
    # release: time for a compromised or broken version to be yanked upstream.
    # Security updates ignore the cooldown.
    cooldown:
      default-days: 7
    groups:
      python-security:
        applies-to: security-updates
        patterns: ['*']
    # Exact pins in pyproject.toml. A new ty or jscpd can report findings across
    # the tree, so they are bumped by hand with the fixes in the same PR.
    ignore:
      - dependency-name: ty
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: jscpd
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch

  # React frontend.
  - package-ecosystem: npm
    directory: /frontend
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
    groups:
      frontend-security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # openapi-typescript peers on TS ^5 and crashes on 7 (`ts.factory`
      # undefined), breaking `task api-schema`; TS7 also defaults `strict` on.
      # Lift this once openapi-typescript supports 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # 30.1.0's FormData/File can't be sent through Node's fetch ("reading
      # '_buffer'"), so every upload test fails. Only 30.1.x is skipped so a
      # fixed release still comes through.
      - dependency-name: jsdom
        versions: ['30.1.x']

  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns: ['*']

  # Base image in the published container.
  #
  # Deliberately outside the group and NOT auto-merged. Every update here is a
  # runtime major (node 24 -> 25, python 3.13 -> 3.14), and no required check
  # builds the image or runs the tests on it, so a green PR says nothing about
  # whether the container still works. These stay a hand-merged PR, a few
  # times a year.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
