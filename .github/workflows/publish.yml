# Release whatever is at the tip of main: publish the server image to GitHub
# Container Registry and cut a GitHub release for it.
#
# Nothing in a pull request bumps a version. The number is worked out here from
# the existing git tags (see "Work out the next version"), and the tag is
# created by the release at the end of the run.
#
# The deployment target is an unraid box (amd64), which pulls
# ghcr.io/ember-and-ink/aspect-archive:latest. Development on a Mac runs from
# source (`uv run python -m aspect.server`) rather than from this image, so
# there is no arm64 variant to build -- adding one means QEMU emulation on the
# runner and a several-times-slower build for an image nothing pulls.
#
# See docs/DEPLOY.md for the one-time steps this workflow deliberately does not
# automate (making the package public, seeding the data mount).

name: publish

on:
  push:
    branches: [main]
  schedule:
    # Daily, 06:41 UTC. A merge performed with a workflow's GITHUB_TOKEN does
    # not fire `push` workflows, and that is exactly how Dependabot PRs land
    # (see dependabot-automerge.yml). This sweep picks those up. When the tip
    # of main is already released it does nothing.
    - cron: "41 6 * * *"
  workflow_dispatch:

env:
  # Lowercase: the registry rejects uppercase path components, and the owner is
  # spelled "ember-and-ink".
  IMAGE_NAME: ghcr.io/ember-and-ink/aspect-archive

# One release at a time, so two merges in quick succession cannot both claim
# the same version number.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # To create the release and its tag.
      contents: write
      # To push the image. GITHUB_TOKEN carries both, so there is no PAT to
      # create, store as a secret, or rotate.
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Always the current tip of main rather than the commit that
          # triggered the run, so a queued run never releases a stale commit.
          ref: main
          fetch-depth: 0 # all tags, to find the latest release

      - name: Work out the next version
        id: plan
        run: |
          if [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then
            echo "$(git rev-parse --short HEAD) is already released. Nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Next patch after the newest release tag...
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          NEXT=""
          if [ -n "$LATEST" ]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          # ...unless pyproject.toml asks for something higher, which is how a
          # minor or major release is made (`make bump-minor` / `bump-major`).
          FLOOR=$(grep -E '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          VERSION=$(printf '%s\n' "$NEXT" "$FLOOR" | sort -V | tail -n1)
          echo "Latest release: ${LATEST:-none}, pyproject.toml: $FLOOR, releasing: $VERSION"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - if: steps.plan.outputs.release == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - if: steps.plan.outputs.release == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.plan.outputs.release == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          # :latest tracks main (what unraid follows), :sha-<short> is the exact
          # rollback target for any build, and :1.2.3 / :1.2 are the release.
          #
          # The sha tag and revision label are spelled out rather than left to
          # `type=sha`, which reads the commit that triggered the run. That is
          # not necessarily the one checked out above.
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.plan.outputs.short_sha }}
            type=semver,pattern={{version}},value=v${{ steps.plan.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.plan.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ steps.plan.outputs.sha }}

      - if: steps.plan.outputs.release == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without this every run reinstalls pngquant and re-resolves the whole
          # locked dependency set; with it, a change under aspect/ only
          # rebuilds the COPY layers.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Last, so the tag only exists once the image does. The tag is what marks
      # a commit as released; if the build fails, the next run tries again.
      - name: Create release
        if: steps.plan.outputs.release == 'true'
        run: |
          gh release create "v$VERSION" \
            --target "$SHA" \
            --title "$VERSION" \
            --generate-notes
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          SHA: ${{ steps.plan.outputs.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
