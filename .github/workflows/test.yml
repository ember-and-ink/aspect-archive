# The gate in front of publish.yml: a push to main publishes :latest, so a
# broken tree should fail here first.
#
# Both suites are fast (the Python one is ~10s) and neither needs the archive --
# tests/conftest.py builds real card PNGs in a tmp directory, so nothing here
# depends on data/, which is why this can run on a clean runner at all.

name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job here only reads the tree; nothing pushes, comments or publishes.
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      # --frozen: fail if uv.lock disagrees with pyproject.toml rather than
      # silently resolving something the image will never contain.
      - run: uv sync --frozen
      - run: uv run python -m pytest -q

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      # The userscripts' suite: node:test with zero deps, so there is nothing
      # to install first (see the test-js target in the Makefile).
      - run: make test-js

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint:check
      - run: npx tsc -b --noEmit
      - run: npm run test

  # The client's types are generated from FastAPI and committed. This is the
  # check that keeps them honest: regenerate, and fail if the tree moved. A red
  # run here means a route changed without its client -- regenerate with
  # `make api-schema` and commit the result.
  api-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
      - run: cd frontend && npm ci
      - run: make api-schema
      - name: Fail if the generated client is out of date
        run: git diff --exit-code -- frontend/src/lib/api-schema.ts
