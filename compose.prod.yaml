# Running the published image, rather than building it: compose.yaml is the
# local build (`make docker-build`), this one pulls from GHCR and is what a
# server -- unraid or otherwise -- actually runs.
#
#   docker compose -f compose.prod.yaml pull
#   docker compose -f compose.prod.yaml up -d
#
# Every knob below has a default that works on unraid unchanged. Override any
# of them in a `.env` beside this file, or in the environment. Full runbook:
# docs/DEPLOY.md.

services:
  archive:
    image: ghcr.io/ember-and-ink/jai-proxy:${JAI_PROXY_TAG:-latest}
    container_name: jai-proxy
    # Only the HOST side is configurable. The container always listens on 8000,
    # so the healthcheck baked into the image keeps working; move the host port
    # if something else on the box already has 8000 (SillyTavern's stock port is
    # also 8000). The userscripts read their server URL from Tampermonkey
    # storage now, so whatever you publish here is fine -- set the same
    # host:port there. See docs/DEPLOY.md.
    ports:
      - "${JAI_PROXY_PORT:-8000}:8000"
    # The only mount there is. Archive, galleries, thumbnail cache,
    # settings.json and the server's working state all live under it, so this
    # single bind is the whole of the container's state.
    volumes:
      - "${JAI_PROXY_DATA:-/mnt/user/appdata/jai-proxy}:/app/data"
    # unraid's shares are owned by nobody:users (99:100); the image's own user
    # is uid 1000. Running as the directory's owner is simpler and safer than
    # chowning the share to 1000, and the image supports an arbitrary uid --
    # everything it needs under /app is world-readable and it writes only into
    # /app/data. If the mount is unwritable the server says so in one line and
    # exits rather than dying in a traceback (proxy/server.py::_preflight).
    user: "${PUID:-99}:${PGID:-100}"
    environment:
      # 127.0.0.1 would only be reachable from inside the container.
      JAI_PROXY_HOST: "0.0.0.0"
    restart: unless-stopped
