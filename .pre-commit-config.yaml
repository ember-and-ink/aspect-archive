---
# Run by prek (https://prek.j178.dev/), a Rust drop-in for pre-commit that reads
# this file unchanged. `task pre-commit-install` installs the hooks once per
# checkout; `task pre-commit` runs every hook against the whole tree. Mirrors the
# lint half of test.yml, so a commit that would fail CI fails here first.

# Never rewritten by the fixers below:
#   tests/fixtures/      real captured payloads -- they must stay byte-exact
#   *.user.js            compiled by `task compile`; commit what it produces
#   api-schema.ts        generated by `task api-schema`; CI diffs it
#   aspect/pngquant      the vendored mac binary
exclude: |
  (?x)^(
    tests/fixtures/.*|
    userscript/.*\.user\.js|
    frontend/src/lib/api-schema\.ts|
    aspect/pngquant
  )$

repos:
  # prek runs these with its own built-in Rust implementations rather than
  # cloning the repo and building a Python environment for them.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key

  # Staged changes only, so the benign hits in history (the deleted web/ tree's
  # vendored public keys) never come up. See .gitleaks.toml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Validate Taskfile.yml against Task's own JSON schema, so a misspelled key or
  # a wrong type fails here rather than at run time.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-taskfile

  # These all invoke tasks that operate on the whole tree, so filenames must not
  # be appended -- `task lint-check foo.py` would have Task treat foo.py as a
  # second task name rather than passing it to ruff. `uv run` uses the Task
  # pinned in uv.lock, and each task runs the tool version pinned in uv.lock or
  # package-lock.json, so a local pass matches CI.
  #
  # The `files`/`types` filters decide whether a hook runs at all: it runs once,
  # over the whole tree, when any staged file matches.
  - repo: local
    hooks:
      # check --fix before format, as ruff recommends: a fix can leave code to reformat.
      - id: lint-check
        name: Check code for lint errors with ruff-check
        entry: uv run task lint-check
        language: system
        pass_filenames: false
        # pyproject.toml carries the rule selection, so a change there re-lints.
        files: (\.pyi?|^pyproject\.toml)$
      - id: lint-format
        name: Check codestyle format with ruff-format
        entry: uv run task lint-format
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      # ty checks the whole project; a filename subset loses cross-module types.
      - id: lint-typing
        name: Check typing errors with ty
        entry: uv run task lint-typing
        language: system
        pass_filenames: false
        files: (\.pyi?|^pyproject\.toml|^uv\.lock)$
      # A clone of an unstaged file is still a clone, so it scans everything in
      # scope (a few ms) rather than just what is staged.
      - id: lint-dupes
        name: Check for copy-pasted code with jscpd
        entry: uv run task lint-dupes
        language: system
        pass_filenames: false
        files: ^(aspect/|frontend/src/|userscript/src_|\.jscpd\.json$)
      - id: uv-lock
        name: uv.lock matches pyproject.toml
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      - id: frontend-lint
        name: Format and lint the frontend
        entry: uv run task frontend-lint
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: frontend-typing
        name: Check frontend typing errors with tsc
        entry: uv run task frontend-typing
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: test-js
        name: Run the userscript unit tests
        entry: uv run task test-js
        language: system
        pass_filenames: false
        files: ^userscript/
