# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# Install once per checkout with `make pre-commit-install`. Mirrors the lint
# half of test.yml, so a commit that would fail the frontend job fails here
# first instead.

# Never rewritten by the fixers below:
#   tests/fixtures/      real captured payloads -- they must stay byte-exact
#   *.user.js            compiled by `make compile`; commit what it produces
#   api-schema.ts        generated by `make api-schema`; CI diffs it
#   proxy/pngquant       the vendored mac binary
exclude: |
  (?x)^(
    tests/fixtures/.*|
    userscript/.*\.user\.js|
    frontend/src/lib/api-schema\.ts|
    proxy/pngquant
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key

  # Staged changes only, so the benign hits in history (the deleted web/ tree's
  # vendored public keys) never come up. See .gitleaks.toml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # These invoke make targets that operate on the whole frontend, so filenames
  # must not be appended -- make would treat them as targets. `files:` keeps
  # them from running on commits that never touch frontend/.
  - repo: local
    hooks:
      - id: frontend-lint
        name: Format and lint the frontend
        entry: make frontend-lint
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: frontend-typing
        name: Check frontend typing errors with tsc
        entry: make frontend-typing
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: test-js
        name: Run the userscript unit tests
        entry: make test-js
        language: system
        pass_filenames: false
        files: ^userscript/
