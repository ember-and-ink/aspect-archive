services:
  archive:
    build: .
    image: aspect-archive:dev
    container_name: aspect-archive
    # 8000 is not a preference: both userscripts hardcode
    # http://127.0.0.1:8000 (userscript/src_jai/client-server.js,
    # src_saucepan/config.js). SillyTavern's stock port is also 8000, so the
    # publish fails while it is running -- stop it, or move it.
    ports:
      - "8000:8000"
    # The only mount there is. The archive, the galleries, the thumbnail cache,
    # settings.json and the server's working state all live under data/, so
    # nothing the container writes lands inside the image.
    volumes:
      - ./data:/app/data
    environment:
      ASPECT_HOST: "0.0.0.0"
    restart: unless-stopped
