# `version` is major.minor only. The patch number is assigned by the publish
# workflow from the git tags, so it never needs touching for an ordinary
# change. To cut a new minor or major release, run `make bump-minor` or
# `make bump-major` in the PR that earns it.
[project]
name = "jai-proxy"
version = "0.3.0"
description = "Archives JanitorAI character cards as SillyTavern V3 PNGs."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    # Multipart request parsing, which FastAPI needs (and refuses to start
    # without) for the two write endpoints that take a file rather than JSON:
    # replacing a card's avatar and adding a gallery image.
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "tinycss2>=1.4",
    "pillow>=11.0",
    "pydantic-settings>=2.6",
    "rich>=15.0.0",
    # MEGA gallery decrypt (AES ECB/CBC/CTR) -- stdlib has no raw AES.
    "pycryptodome>=3.21",
]

[project.scripts]
jai-proxy = "proxy.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proxy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "real_media_queue: run the real add-time image download queue instead of the autouse recorder",
]
