# `version` is major.minor only. The patch number is assigned by the publish
# workflow from the git tags, so it never needs touching for an ordinary
# change. To cut a new minor or major release, run `task bump-minor` or
# `task bump-major` in the PR that earns it.
[project]
name = "aspect-archive"
version = "0.3.0"
description = "A self-hosted character card library: V3 card PNGs with their galleries and expressions."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    # Multipart request parsing, which FastAPI needs (and refuses to start
    # without) for the two write endpoints that take a file rather than JSON:
    # replacing a card's avatar and adding a gallery image.
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "tinycss2>=1.4",
    "pillow>=11.0",
    "pydantic-settings>=2.6",
    "rich>=15.0.0",
    # MEGA gallery decrypt (AES ECB/CBC/CTR) -- stdlib has no raw AES.
    "pycryptodome>=3.21",
]

[project.scripts]
aspect-archive = "aspect.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.17",
    # prek, not pre-commit: a single Rust binary that reads the same
    # .pre-commit-config.yaml, so no virtualenv/filelock/nodeenv chain in the lock.
    "prek>=0.5.10",
    # Task (taskfile.dev), the repo's command runner. A floor pin like the rest:
    # Taskfile v3 is stable, so a routine Dependabot bump is safe.
    "go-task-bin>=3.54.0",
    # Exact pin, and Dependabot ignores it: ty is pre-1.0 and a bump can add new
    # errors across the tree. Bump it by hand and fix what it finds in the same PR.
    "ty==0.0.99",
    # Copy-paste detection (`task lint-dupes`, settings in .jscpd.json). Exact pin
    # for the same reason: a new release can find clones the old one missed.
    "jscpd==5.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aspect"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "real_media_queue: run the real add-time image download queue instead of the autouse recorder",
]

[tool.ruff]
line-length = 120
# target-version is left unset: ruff reads it from requires-python.

[tool.ruff.lint]
# UP (pyupgrade) keeps syntax current with requires-python.
select = ["E", "W", "F", "B", "I", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter markers are meant to sit in argument defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Query", "fastapi.Depends", "fastapi.Body", "fastapi.Form"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ty.analysis]
# Playwright is only for the browser smoke gate (`task frontend-smoke`), which
# pulls it in with `uv run --with playwright`, so it is not in the locked env.
allowed-unresolved-imports = ["playwright.**"]
